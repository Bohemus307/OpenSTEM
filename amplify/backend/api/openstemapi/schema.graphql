type FeaturedExperiment @model @auth(rules: [{ allow: public }]) {
  id: ID!
  experiment_id: String
  name: String
  primaryImage: String
  secondaryImage: String
  status: String
  description: String
  envData: String
  nutrientData: String
  duration: String
  start: Int
  end: Int
  sponsor: String
  dataPoints: [Stat]
  sponsorIcon: String
  createdAt: String
  updatedAt: String
}

type Stat {
  id: ID!
  dataType: String
}
