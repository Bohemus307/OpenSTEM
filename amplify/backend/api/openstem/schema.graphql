type User @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String
  email: String!
  imageUrl: String
}

type FeaturedExperiment @model @auth(rules: [{ allow: public }]) {
  id: ID!
  experiment_id: String
  name: String
  primaryImage: String
  secondaryImage: String
  status: String
  description: String
  duration: String
  sponsor: String
  sponsorIcon: String
  createdAt: String
  updatedAt: String
}

type Stat {
  id: ID!
  dataType: String
}
