type FeaturedExperiment @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String!
  primaryImage: String
  secondaryImage: String
  status: String
  description: String
  envData: String
  nutrientData: String
  duration: String
  start: AWSTimestamp
  end: AWSTimestamp
  sponsor: String
}

type User @model @auth(rules: [{ allow: public }]) {
  id: ID!
  email: String!
  name: String
  experiments: [Experiment] @hasMany
}

type Experiment @model @auth(rules: [{ allow: public }]) {
  id: ID!
  user: User @belongsTo
  description: String!
  type: String
  status: String
  envData: String
  nutrientData: String
  duration: String
  start: AWSTimestamp
  end: AWSTimestamp
  primaryImage: String
  secondaryImage: String
}
