# This "input" configures a global authorization rule to enable public access to
# all models in this schema. Learn more about authorization rules here: https://docs.amplify.aws/cli/graphql/authorization-rules
input AMPLIFY {
  globalAuthRule: AuthRule = { allow: public }
} # FOR TESTING ONLY!
type FeaturedExperiment @model {
  id: ID! @primaryKey
  name: String!
  primaryImage: String
  secondaryImage: String
  status: String
  description: String
  envData: String
  nutrientData: String
  duration: String
  start: AWSTimestamp
  end: AWSTimestamp
  sponsor: String
}

type User @model {
  id: ID!
  email: String! @primaryKey
  name: String
  experiments: [Experiment] @hasMany
}

type Experiment @model {
  id: ID! @primaryKey
  user: User @belongsTo
  description: String!
  type: String
  status: String
  envData: String
  nutrientData: String
  duration: String
  start: AWSTimestamp
  end: AWSTimestamp
  primaryImage: String
  secondaryImage: String
}
